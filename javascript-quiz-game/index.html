<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Quiz Game</title>
    <link rel="stylesheet" href="style.css" type="text/css" media="screen">
</head>
<body class="d-flex align-items-center justify-content-center min-h-100">

<section class="container mt-5 mb-5">
    <div class="card">
        <div class="card-body">
            <div id="quiz-status"></div>
            <h1 class="card-title">Quiz Game <span class="badge text-bg-secondary" id="quiz-counter"></span></h1>
            <button type="button" id="quiz-start" class="btn btn-primary mt-3 mb-3">Start</button>
            <p class="card-text mt-3" id="quiz-question">
                <strong id="question"></strong>
            </p>
            <form class="mt-3" id="quiz-form">
                <div class="form-group d-flex align-items-center">
                    <input type="text" class="form-control me-3" name="quiz-answer" id="quiz-answer">
                    <button type="submit" class="btn btn-primary">Answer</button>
                </div>
                <div id="quiz-result" class="d-none mt-3 p-3 bg-light"></div>
            </form>
        </div>
    </div>
</section>
 
    
<script src="script.js"></script>    
</body>
</html>
