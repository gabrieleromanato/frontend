<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Inline Validation</title>
    <link rel="stylesheet" href="style.css" media="screen">
</head>
<body>
    <main class="app">
        <section class="app-register">
            <header class="app-section-header">
                <h1>Sign Up</h1>
            </header>
            <form action="#" class="app-form" novalidate>
                <div class="form-group">
                    <label for="firstname" class="form-label">
                        First Name <span class="req">*</span>
                    </label>
                    <input required data-error="First Name is required." type="text" id="firstname" name="firstname" class="form-input">
                </div>
                <div class="form-group">
                    <label for="lastname" class="form-label">
                        Last Name <span class="req">*</span>
                    </label>
                    <input required data-error="Last Name is required." type="text" id="lastname" name="lastname" class="form-input">
                </div>
                <div class="form-group">
                    <label for="email" class="form-label">
                        Email <span class="req">*</span>
                    </label>
                    <input required data-error="Invalid email address." type="email" id="email" name="email" class="form-input">
                </div>
                <div class="form-group" class="form-label">
                    <label for="password">
                        Password <span class="req">*</span>
                    </label>
                    <input required data-error="Password is required." type="text" id="password" name="password" class="form-input">
                </div>
                <div class="form-group">
                    <label for="password_confirm" class="form-label">
                        Repeat Password <span class="req">*</span>
                    </label>
                    <input required data-error="Password is required." type="text" id="password_confirm" name="password_confirm" class="form-input">
                </div>
                <div class="form-actions">
                    <button type="reset" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Sign Up</button>
                </div>
            </form>
        </section>
    </main>
    <script src="https://unpkg.com/validator@latest/validator.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
